plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

loom {
    splitEnvironmentSourceSets()

    mods {
        vantaboost {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true

    testLogging {
        events "failed", "skipped"
    }
}

tasks.register("verifyClientMixinConfiguration") {
    dependsOn tasks.named("compileClientJava"), tasks.named("processResources")

    doLast {
        def json = new groovy.json.JsonSlurper()
        def metadata = json.parse(file("src/main/resources/fabric.mod.json"))

        if (!(metadata.mixins instanceof List) || metadata.mixins.isEmpty()) {
            throw new GradleException("fabric.mod.json must register at least one mixin config")
        }

        metadata.mixins.each { configEntry ->
            def configName = configEntry instanceof Map ? configEntry.config : configEntry.toString()
            if (configEntry instanceof Map && configEntry.environment != "client") {
                throw new GradleException("Client mixin config must be environment-scoped: ${configName}")
            }

            def configFile = file("src/main/resources/${configName}")
            if (!configFile.isFile()) {
                throw new GradleException("Registered mixin config is missing: ${configFile}")
            }

            def config = json.parse(configFile)
            if (config.required != true || config.injectors?.defaultRequire != 1) {
                throw new GradleException("Mixin config must be required and use defaultRequire=1: ${configName}")
            }

            def mixinPackage = config.get("package")?.toString()
            def declaredMixins = config.mixins
            if (!mixinPackage || !(declaredMixins instanceof List) || declaredMixins.isEmpty()) {
                throw new GradleException("Client mixin config has no package or mixins: ${configName}")
            }

            declaredMixins.each { mixinName ->
                def relativeClassPath = "${mixinPackage.replace('.', '/')}/${mixinName}.class"
                def compiled = sourceSets.client.output.classesDirs.files.any { outputDir ->
                    new File(outputDir, relativeClassPath).isFile()
                }
                if (!compiled) {
                    throw new GradleException("Declared client mixin was not compiled: ${relativeClassPath}")
                }
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyClientMixinConfiguration")
}

tasks.matching { it.name == "runClient" }.configureEach {
    if (providers.gradleProperty("vantaboostCiSmoke").isPresent()) {
        useXvfb.set(true)
        jvmArgs "-Dvantaboost.ciSmoke=true"
    }
}
