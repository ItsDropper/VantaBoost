name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build and test
        run: gradle --no-daemon clean build
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke-test client mixin application
        run: LIBGL_ALWAYS_SOFTWARE=1 timeout 300s gradle --no-daemon runClient -PvantaboostCiSmoke=true
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vantaboost-build
          path: build/libs/*.jar
          if-no-files-found: error
